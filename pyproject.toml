[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scalemind"
version = "0.1.0"
description = "Autoscaling cloud par reinforcement learning, sous budget d'erreur SLO, sur trafic Wikipédia réel."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "gymnasium>=0.29",
    "requests>=2.31",
]

[project.optional-dependencies]
rl = ["torch>=2.2", "stable-baselines3>=2.3", "matplotlib>=3.8"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[tool.setuptools]
packages = ["scalemind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]
